[project]
name = "cq-backend"
version = "0.1.0"
description = "Evidence-backed planning document extraction and backend orchestration"
readme = "README.md"
authors = [
    { name = "wipesides", email = "atasesli@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docling>=2.133.0",
    "httpx>=0.28.1",
    "litestar>=2.24.0",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[openai]>=2.54.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
    "zova>=1.1.0",
]

[project.scripts]
cq-backend = "cq_backend:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
